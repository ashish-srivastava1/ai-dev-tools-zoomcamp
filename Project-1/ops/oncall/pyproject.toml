[project]
name = "learnloop-oncall"
version = "0.1.0"
description = "LearnLoop on-call responder: receives Grafana alerts and wakes a headless coding agent"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.27,<1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
  "pytest>=8,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
