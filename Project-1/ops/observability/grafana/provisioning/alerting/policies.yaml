apiVersion: 1

policies:
  - orgId: 1
    receiver: learnloop-oncall-agent
    group_by: ["alertname"]
    group_wait: 5s
    group_interval: 10s
    repeat_interval: 5m
    routes:
      - receiver: learnloop-oncall-agent
        object_matchers:
          - ["service", "=", "learnloop"]
        group_wait: 5s
        group_interval: 10s
        repeat_interval: 5m
