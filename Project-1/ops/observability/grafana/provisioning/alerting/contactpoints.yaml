apiVersion: 1

contactPoints:
  - orgId: 1
    name: learnloop-oncall-agent
    receivers:
      - uid: learnloop-oncall-webhook
        type: webhook
        settings:
          # Grafana runs in a container; the on-call responder (ops/oncall) runs on the host.
          url: http://host.docker.internal:8001/alerts
          httpMethod: POST
        disableResolveMessage: false
