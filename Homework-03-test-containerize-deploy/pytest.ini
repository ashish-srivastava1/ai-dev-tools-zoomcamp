# Pytest config for the backend suite. Lives at the repo (homework) root
# because that's the working directory for the documented test command
# (`uv run --project backend pytest`), so it's what pytest discovers as the
# rootdir config.
[pytest]
testpaths = backend/tests

# Integration tests spin up the docker-compose stack; they're excluded from the
# default run so `pytest` stays fast and Docker-free. Run them explicitly with:
#   uv run --project backend pytest -m integration
markers =
    integration: end-to-end tests that run against the docker-compose stack (requires Docker)
addopts = -m "not integration"
