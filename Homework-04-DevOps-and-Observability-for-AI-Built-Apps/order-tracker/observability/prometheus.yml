global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  # Application metrics, re-exported by the collector in Prometheus format.
  - job_name: order-tracker-app
    static_configs:
      - targets: ["otel-collector:8889"]

  # The collector's own internal metrics.
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]
