apiVersion: 1

policies:
  - orgId: 1
    receiver: incident-responder
    group_by: ["alertname"]
    group_wait: 5s
    group_interval: 10s
    repeat_interval: 1m
    routes:
      - receiver: incident-responder
        object_matchers:
          - ["service", "=", "order-tracker"]
        group_wait: 5s
        group_interval: 10s
        repeat_interval: 1m
