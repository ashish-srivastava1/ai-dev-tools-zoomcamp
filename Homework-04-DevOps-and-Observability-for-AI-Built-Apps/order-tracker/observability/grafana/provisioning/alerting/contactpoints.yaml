apiVersion: 1

contactPoints:
  - orgId: 1
    name: incident-responder
    receivers:
      - uid: incident-responder-webhook
        type: webhook
        settings:
          # Grafana runs in a container; the responder runs on the host.
          url: http://host.docker.internal:8001/alerts
          httpMethod: POST
        disableResolveMessage: false
